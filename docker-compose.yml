services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rrm
      POSTGRES_USER: rrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rrm_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rrm_data:/var/lib/postgresql/data
      # Rulează doar la prima pornire, când volumul este gol.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrm -d rrm"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rrm:${POSTGRES_PASSWORD:-rrm_dev}@db:5432/rrm
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  rrm_data:
